spring:
  datasource:
    druid:
      master:
        url: ${SPRING_DATASOURCE_DRUID_MASTER_URL:jdbc:mysql://localhost:3306/chen_002?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
        username: ${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:CHANGE_ME}
        password: ${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:CHANGE_ME}
        driver-class-name: com.mysql.cj.jdbc.Driver
        initial-size: 2
        min-idle: 2
        max-active: 10
        validation-query: SELECT 1
      slave:
        url: ${SPRING_DATASOURCE_DRUID_SLAVE_URL:jdbc:mysql://localhost:3306/chen_002?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
        username: ${SPRING_DATASOURCE_DRUID_SLAVE_USERNAME:CHANGE_ME}
        password: ${SPRING_DATASOURCE_DRUID_SLAVE_PASSWORD:CHANGE_ME}
        driver-class-name: com.mysql.cj.jdbc.Driver
        initial-size: 2
        min-idle: 2
        max-active: 10
        validation-query: SELECT 1
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: ${DRUID_MONITOR_USERNAME:CHANGE_ME}
        login-password: ${DRUID_MONITOR_PASSWORD:CHANGE_ME}
      web-stat-filter:
        enabled: true
